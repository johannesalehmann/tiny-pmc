[package]
name = "tiny-pmc"
version = "0.1.0"
edition = "2024"

[dependencies]
prism-model = { path = "../prism-model" }
prism-parser = { path = "../prism-parser", features = ["pretty-print"] }
probabilistic-models = { path = "../probabilistic-models" }
probabilistic-properties = { path = "../probabilistic-properties" }
prism-model-builder = { path = "../prism-model-builder" }
probabilistic-model-algorithms = { path = "../probabilistic-model-algorithms" }
umb-parser = { path = "../umb-parser" }

[features]
log-topo-vi-preparation-overhead = ["probabilistic-model-algorithms/log-topo-vi-preparation-overhead"]
log-topo-vi-smallest-eps = ["probabilistic-model-algorithms/log-topo-vi-smallest-eps"]
